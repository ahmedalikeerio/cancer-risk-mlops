stages:
  validate:
    cmd: python src/data/validate.py
    deps:
      - src/data/validate.py
      - data/raw/cancer_risk.csv

  split:
    cmd: python src/data/split.py
    deps:
      - src/data/split.py
      - data/raw/cancer_risk.csv
    outs:
      - data/split/train.csv
      - data/split/test.csv

  preprocess:
    cmd: python src/features/preprocess.py
    deps:
      - src/features/preprocess.py
      - data/split/train.csv
      - data/split/test.csv
    outs:
      - data/processed/train_processed.csv
      - data/processed/test_processed.csv
      - data/processed/preprocessor.joblib

  train:
    cmd: python -m src.models.train
    deps:
      - src/models/train.py
      - src/models/evaluate.py
      - data/processed/train_processed.csv
      - data/processed/test_processed.csv
    metrics:
      - reports/metrics.json:
          cache: false

  tune:
    cmd: python -m src.models.tune
    deps:
      - src/models/tune.py
      - src/models/evaluate.py
      - data/processed/train_processed.csv
      - data/processed/test_processed.csv
    metrics:
      - reports/tuning_results.json:
          cache: false